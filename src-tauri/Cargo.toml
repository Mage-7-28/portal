[package]
name = "portal"
version = "0.1.0"
description = "Portal"
authors = ["Cherry"]
license = "MIT"
repository = "https://gitee.com/Mage-7-28/portal"
edition = "2021"

# Cargo 配置字段说明见 Rust 官方文档：https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# `_lib` 后缀用于让库名与二进制名保持唯一，避免在 Windows 平台发生命名冲突。
# 相关背景见：https://github.com/rust-lang/cargo/issues/8519
name = "portal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
ssh2 = "0.9"
thiserror = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
