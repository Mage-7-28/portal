<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src-tauri/icons/128x128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1f22" />
    <title>Portal</title>
    <style>
      :root {
        color-scheme: dark;
        background: #1e1f22;
      }

      html,
      body {
        margin: 0;
        min-width: 0;
        min-height: 100%;
        background: #1e1f22;
      }

      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #e6e8eb;
      }

      #root {
        display: none;
        min-height: 100dvh;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        min-height: 100dvh;
        padding: 24px;
        overflow: hidden;
        background:
          linear-gradient(rgba(166, 173, 183, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(166, 173, 183, 0.018) 1px, transparent 1px),
          #1e1f22;
        background-size: 32px 32px;
        opacity: 1;
        transition: opacity 180ms ease-out;
      }

      #loading.is-leaving {
        pointer-events: none;
        opacity: 0;
      }

      .loading-panel {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        width: min(352px, 100%);
        box-sizing: border-box;
        column-gap: 12px;
        padding: 16px;
        border: 1px solid #5b5e66;
        border-radius: 8px;
        background: #2b2d30;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          0 14px 34px rgba(0, 0, 0, 0.36);
        text-align: left;
      }

      .loading-logo-shell {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        overflow: hidden;
        border: 1px solid #45474d;
        border-radius: 7px;
        background: #1e1f22;
      }

      .loading-logo {
        display: block;
        width: 38px;
        height: 38px;
        object-fit: contain;
      }

      .loading-copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
      }

      .loading-title {
        margin: 0;
        color: #e6e8eb;
        font-size: 16px;
        font-weight: 650;
        line-height: 1.2;
      }

      .loading-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin: 6px 0 0;
        color: #a9adb6;
        font-size: 12px;
        line-height: 1.3;
      }

      .loading-spinner {
        width: 10px;
        height: 10px;
        box-sizing: border-box;
        border: 2px solid rgba(235, 144, 112, 0.24);
        border-top-color: #eb9070;
        border-radius: 50%;
        animation: portal-loading-spin 760ms linear infinite;
      }

      .loading-progress {
        grid-column: 1 / -1;
        height: 3px;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 999px;
        background: #3a3c42;
      }

      .loading-progress-bar {
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #eb9070;
        animation: portal-loading-progress 1.45s ease-in-out infinite;
      }

      @keyframes portal-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes portal-loading-progress {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(290%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loading {
          transition: none;
        }

        .loading-spinner,
        .loading-progress-bar {
          animation: none;
        }
      }

      @media (max-width: 380px) {
        #loading {
          padding: 16px;
        }

        .loading-panel {
          padding: 14px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="loading" role="status" aria-live="polite" aria-label="正在启动 Portal">
      <div class="loading-panel">
        <div class="loading-logo-shell">
          <img class="loading-logo" src="./src-tauri/icons/128x128.png" width="38" height="38" alt="" />
        </div>
        <div class="loading-copy">
          <h1 class="loading-title">Portal</h1>
          <p class="loading-status"><span class="loading-spinner" aria-hidden="true"></span>正在启动</p>
        </div>
        <div class="loading-progress" aria-hidden="true">
          <div class="loading-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
